<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 4.7 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="../ecommerce_site/index.css" />
  </head>
  <body>
    <!-- brand logo and navigation, add to cart -->
    <nav class="navbar">
      <!-- 1. Logo  -->
      <div class="logo-container">
        <button class="menu-toggle">
          <i class="fa fa-bars"></i>
        </button>
        <div class="logo">SHOP.CO</div>
      </div>

      <!-- 2. Nav Items -->
      <ul class="nav-links">
        <li><a href="#">Shop</a></li>
        <li><a href="#">On Sale</a></li>
        <li><a href="#">New Arrival</a></li>
        <li><a href="#">Brand</a></li>
      </ul>

      <!-- 3. Search Bar -->
      <div class="search-box">
        <span class="search-inp-container">
          <i class="fa fa-search"></i>
          <input type="text" placeholder="Search..." />
        </span>
      </div>

      <!-- 4. Icons -->
      <div class="nav-icons">
        <i class="fa fa-shopping-bag"></i>
        <i class="fa fa-user-circle"></i>
      </div>
    </nav>

    <!-- secondary nav -->
    <nav id="secondary-nav">
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <i class="fa fa-angle-right"></i>
        <li><a href="#">About</a></li>
      </ul>
    </nav>

    <!-- side bar of for the filter tab -->
    <div id="main-container">
      <div id="filter">
        <p class="heading-text">
          <span>filter</span><img src="" alt="filter-icon" />
        </p>
        <hr />
        <div id="filter-category-container">
          <span><p>T-shirt</p></span>
          <span><p>T-shirt</p></span>
          <span><p>T-shirt</p></span>
        </div>
        <hr />
        <span class="heading-text">price range</span
        ><img src="" alt="filter-icon" />
        <div>slider</div>
        <hr />
        <button>Apply filter</button>
      </div>

      <!-- product listing -->
      <div id="category-page">
        <div id="heading-text">
          <h4>Category-name</h4>
        </div>

        <!-- product card -->
        <div class="product-card">
          <div class="product-img-container">
            <img src="" alt="product-img" class="product-img" />
          </div>
          <p class="product-name">Product name</p>
          <p class="product-price">000.00</p>
        </div>
      </div>
    </div>
  </body>
  <script src="../ecommerce_site/index.js"></script>
</html>
