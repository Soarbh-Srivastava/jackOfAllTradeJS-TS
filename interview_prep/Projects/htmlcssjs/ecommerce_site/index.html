<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="../ecommerce_site/index.css" />
  </head>
  <body>
    <!-- brand logo and navigation, add to cart -->
    <nav class="navbar">
      <!-- 1. Logo -->
      <div class="logo-container">
        <button class="menu-toggle">
          <i class="fa fa-bars"></i>
        </button>
        <div class="logo">SHOP.CO</div>
      </div>
      <!-- 2. Nav Items -->
      <ul class="nav-links">
        <li><a href="#">Shop</a></li>
        <li><a href="#">On Sale</a></li>
        <li><a href="#">New Arrival</a></li>
        <li><a href="#">Brand</a></li>
      </ul>
      <!-- 3. Search Bar -->
      <div class="search-box">
        <span class="search-inp-container">
          <i class="fa fa-search"></i>
          <input type="text" placeholder="Search..." />
        </span>
      </div>
      <!-- 4. Icons -->
      <div class="nav-icons">
        <i class="fa fa-shopping-bag"></i>
        <i class="fa fa-user-circle"></i>
      </div>
    </nav>

    <!-- secondary nav -->
    <nav id="secondary-nav">
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <i class="fa fa-angle-right"></i>
        <li><a href="#">About</a></li>
      </ul>
    </nav>

    <!-- Mobile Floating Filter Trigger Button -->
    <button id="mobile-filter-trigger" class="mobile-only-btn">
      <i class="fa fa-filter"></i> Filters
    </button>

    <!-- side bar of for the filter tab -->
    <div id="main-container">
      <form action="/submit">
        <div id="filter">
          <div class="text-icon">
            <span class="heading-text">Filter</span>
            <!-- Toggled icons for desktop and mobile states -->
            <i
              class="fa fa-filter desktop-filter-icon"
              style="color: #a1a1a1"
            ></i>
            <i
              class="fa fa-times mobile-filter-close"
              style="display: none; cursor: pointer"
            ></i>
          </div>
          <hr />
          <div id="filter-category-container">
            <span><button>T-shirt</button></span>
            <span><button>T-shirt</button></span>
            <span><button>T-shirt</button></span>
          </div>
          <hr />
          <div class="price-filter-wrapper">
            <div class="text-icon">
              <span class="heading-text">Price</span>
            </div>
            <!-- Numbers display box -->
            <div class="price-input-container">
              <div class="field">
                <span>Min</span>
                <span class="price-display"
                  >$<span id="min-val">100</span></span
                >
              </div>
              <div class="field">
                <span>Max</span>
                <span class="price-display"
                  >$<span id="max-val">400</span></span
                >
              </div>
            </div>
            <!-- The overlapping sliders -->
            <div class="slider-container">
              <div class="slider-track"></div>
              <input
                type="range"
                class="range-min"
                min="0"
                max="500"
                value="100"
                step="10"
              />
              <input
                type="range"
                class="range-max"
                min="0"
                max="500"
                value="400"
                step="10"
              />
            </div>
          </div>
          <hr />
          <button class="filter-btn" type="submit">Apply filter</button>
        </div>
      </form>

      <!-- product listing -->
      <!-- product listing container -->
      <div id="category-page">
        <div id="heading-text">
          <h4 id="category-title">Category Name</h4>
        </div>

        <!-- JavaScript injects dynamic nodes directly here -->
        <div class="products-grid" id="products-container">
          <!-- Template Card Blueprint -->
          <div class="product-card">
            <div class="product-img-container">
              <img src="" alt="product-img" class="product-img" />
            </div>
            <div class="product-info">
              <p class="product-name">Product Name Placeholder</p>
              <p class="product-price">$0.00</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="../ecommerce_site/index.js"></script>
</html>
