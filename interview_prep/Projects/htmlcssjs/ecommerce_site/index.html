<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../ecommerce_site/index.css" />
  </head>
  <body>
    <!-- brand logo and navigation, add to cart -->
    <nav class="navbar">
      <!-- 1. Logo -->
      <div class="logo">SHOP.CO</div>

      <!-- 2. Nav Items -->
      <ul class="nav-links">
        <li><a href="#">Shop</a></li>
        <li><a href="#">On Sale</a></li>
        <li><a href="#">New Arrival</a></li>
        <li><a href="#">Brand</a></li>
      </ul>

      <!-- 3. Search Bar -->
      <div class="search-box">
        <!-- <img src="" alt="search-icon" class="search-icon" /> -->
        🔍
        <input type="text" placeholder="Search..." />
      </div>

      <!-- 4. Icons -->
      <div class="nav-icons">
        <span class="icon">🛒</span>
        <span class="icon">👤</span>
      </div>
    </nav>

    <!-- secondar nav  -->

    <nav id="secondary-nav">
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>

    <!-- side bar of for the filter tab  -->

    <div id="main-container">
      <div id="filter">
        <p class="filter-heading-text">
          <span>filter</span><img src="" alt="filter-icon" />
        </p>
        <hr />
        <div id="filter-category-container">
          <span><p>T-shirt</p></span>
          <span><p>T-shirt</p></span>
          <span><p>T-shirt</p></span>
        </div>
        <hr />
        <span>price range</span><img src="" alt="filter-icon" />
        <div>slider</div>
        <hr />
        <button>Apply filter</button>
      </div>

      <!-- product listing  -->

      <div id="category-page">
        <div id="category-name">
          <h4>Category-name</h4>
        </div>
        <hr />
        <!-- product card -->
        <div class="product-card">
          <div class="product-img-container">
            <img src="" alt="product-img" class="product-img" />
          </div>
          <p class="product-name">Product name</p>
          <p class="product-price">000.00</p>
        </div>
      </div>
    </div>
  </body>
</html>
